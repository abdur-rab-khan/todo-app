# : schema https://json.schemastore.org/pyproject.json
[project]
name = "todo-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Abdur Rab Khan", email = "abdurrabkhan222@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.50",
]

[project.scripts]
todo-app = "todo_app:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "app.main:app"

# 👉 We can easily set the custom folder structure directly using following configuration
[tool.uv.build-backend]
module-name = "app"
module-root = ""
