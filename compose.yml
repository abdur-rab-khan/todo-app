services:
  my-db:
    image: "postgres:16-alpine"
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?"Postgres database name is required"}
      POSTGRES_USER: ${USER:?"Postgres user is required"}
      POSTGRES_PASSWORD: ${PASSWORD:?"Postgres password is required"}
    volumes:
      - my-data:/var/lib/postgresql/data

volumes:
  my-data:
